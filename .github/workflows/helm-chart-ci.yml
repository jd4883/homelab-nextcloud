name: Helm chart CI

on:
  push:
    branches: [main]
    paths:
      - 'deploy/helm/values.yaml'
      - 'deploy/helm/values/**'
      - 'deploy/helm/CHANGELOG.md'
      - 'argocd/**'
      - 'README.md'
  pull_request:
    branches: [main]
    paths:
      - 'deploy/helm/values.yaml'
      - 'deploy/helm/values/**'
      - 'deploy/helm/CHANGELOG.md'
      - 'argocd/**'
      - 'README.md'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag override (e.g. nextcloud-v1.0.0)'
        required: false

concurrency: helm-chart-nextcloud

jobs:
  ci:
    permissions:
      contents: write
      pull-requests: read
    uses: expectedbehaviors/github-actions/.github/workflows/helm-chart-ci.yml@main
    secrets: inherit
    with:
      values_only: true
      release_name: nextcloud
      tag_prefix: nextcloud-v
      publish_enabled: false
      release_notes_enabled: true
      release_tag: ${{ github.event.inputs.release_tag || '' }}
